[project]
name = "clause-review-workbench"
version = "1.5.0"
description = "Local contract review with verifiable source evidence"
requires-python = ">=3.12"
authors = [{name = "Ethan"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "python-docx>=1.1,<2", "PyMuPDF>=1.25,<2", "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "regex>=2024.11", "defusedxml>=0.7,<1"]
[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "playwright>=1.50,<2",
    "pytest>=8,<10",
]
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
